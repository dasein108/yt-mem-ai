[project]
name = "yt-mem-ai"
dynamic = ["version"]
description = "Local-first YouTube AI CLI: download, transcribe (captions -> whisper), embed in LanceDB, discover subscriptions, and summarize/highlight/Q&A."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dasein" }]
keywords = ["youtube", "transcription", "whisper", "lancedb", "summarization", "cli", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "typer>=0.12",
    "yt-dlp>=2024.8",
    "youtube-transcript-api>=1.0",
    "faster-whisper>=1.0",
    "python-dotenv>=1.0",
    "lancedb>=0.15",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "mcp>=1.2"]
mcp = ["mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/dasein108/yt-mem-ai"
Repository = "https://github.com/dasein108/yt-mem-ai"
Issues = "https://github.com/dasein108/yt-mem-ai/issues"

[project.scripts]
yt-ai = "yt_mem_ai.cli:app"
yt-mem-ai = "yt_mem_ai.cli:app"
yt-ai-mcp = "yt_mem_ai.mcp_server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["yt_mem_ai"]
# Ship the scenario playbooks inside the wheel so the MCP server's prompts work
# from an installed package (loaded by mcp_server._load_skill).
force-include = { "skills/yt/SKILL.md" = "yt_mem_ai/_skills/yt.md", "skills/yt-manager/SKILL.md" = "yt_mem_ai/_skills/yt-manager.md" }

[tool.pytest.ini_options]
testpaths = ["tests"]
